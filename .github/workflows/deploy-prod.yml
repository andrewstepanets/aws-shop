name: Deploy prod

# Manual deploy to prod. The `production` environment adds a required-reviewer
# approval gate (configured in GitHub repo settings) before this job runs.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: aws-shop
  STAGE: prod
  COGNITO_DOMAIN_PREFIX: aws-shop-prod-login

jobs:
  deploy:
    name: Build + deploy (prod)
    runs-on: ubuntu-latest
    # Triggers the approval gate; the OIDC token's sub becomes environment:production.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk deploy
        working-directory: backend
        run: npx cdk deploy --all --require-approval never
